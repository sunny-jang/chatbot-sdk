name: Verify
on:
  pull_request:
  push:
    branches: [main, codex/workspace-redesign]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-not-a-production-secret-for-build
      AUTH_TRUST_HOST: 'true'
      POSTGRES_URL: postgres://unused:unused@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/*.test.ts
      - run: npm run build
      - run: npx tsc --noEmit
